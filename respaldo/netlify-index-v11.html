<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Not a Morning Person</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jacquard+24&family=Press+Start+2P&family=VT323&family=UnifrakturMaguntia&display=swap">
<style>
*,*::before,*::after{box-sizing:border-box}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
:root{
  --stone:#17151b; --stone-2:#25212b; --stone-3:#3a3342;
  --parch:#ecdfbd; --parch-2:#dcc796; --parch-3:#c7ad74;
  --ink:#2a1c12; --ink-2:#5b4530;
  --blood:#8b2420; --blood-2:#b3362c; --blood-dk:#4d100d;
  --gold:#d2a647; --gold-2:#f0cf7a; --moss:#3d6a4c; --moss-2:#5c9470;
  --f-title:'UnifrakturMaguntia','Old English Text MT',Georgia,serif;
  --f-body:'IM Fell English',Georgia,'Times New Roman',serif;
  --f-sc:'IM Fell English SC',Georgia,serif;
  --f-num:'Cinzel',Georgia,serif;
  color-scheme:dark;
}
html,body{height:100%}
body{
  background:
    radial-gradient(ellipse 80% 50% at 50% -10%, #5a3419 0%, transparent 60%),
    radial-gradient(ellipse 60% 50% at 0% 100%, #2d1f33 0%, transparent 60%),
    repeating-linear-gradient(0deg, transparent 0 46px, rgba(0,0,0,.25) 46px 48px),
    var(--stone);
  color:var(--parch); font-family:var(--f-body); font-size:17px; line-height:1.45;
  padding-inline:16px; -webkit-tap-highlight-color:transparent;
}
#app{max-width:760px;margin:0 auto;padding-block:16px 40px;display:flex;flex-direction:column;gap:14px}
button{font:inherit;color:inherit}
kbd{font-family:var(--f-num);font-size:.72em;font-weight:700;padding:1px 6px;border:1px solid currentColor;border-bottom-width:3px;border-radius:4px;white-space:nowrap;opacity:.85}
.center{text-align:center}
.muted{color:var(--ink-2)}
.eyebrow{font-family:var(--f-sc);letter-spacing:.14em;text-transform:uppercase;font-size:13px;margin:0;color:var(--blood)}
h1,h2,h3{text-wrap:balance;margin:0}

/* Parchment */
.parchment{
  position:relative; color:var(--ink); border-radius:6px;
  background:
    radial-gradient(ellipse at 15% 8%, rgba(255,255,255,.4), transparent 45%),
    radial-gradient(ellipse at 95% 95%, rgba(120,70,20,.28), transparent 55%),
    radial-gradient(ellipse at 0% 100%, rgba(120,70,20,.18), transparent 40%),
    linear-gradient(var(--parch), var(--parch-2));
  box-shadow:0 0 0 2px var(--parch-3), 0 0 0 5px var(--stone), 0 0 0 7px var(--gold), 0 20px 50px rgba(0,0,0,.65);
  padding:22px clamp(16px,4vw,34px);
}
.orn{font-family:var(--f-title);color:var(--gold);text-align:center;letter-spacing:.5em;font-size:18px;margin:4px 0}
.parchment .orn{color:var(--parch-3)}

/* Buttons */
.btn{
  font-family:var(--f-num);font-weight:700;letter-spacing:.08em;text-transform:uppercase;font-size:15px;
  padding:12px 20px;border-radius:4px;border:2px solid var(--gold);
  background:linear-gradient(var(--blood-2),var(--blood));color:var(--parch);cursor:pointer;
  box-shadow:0 4px 0 var(--blood-dk), inset 0 1px 0 rgba(255,255,255,.22);
  touch-action:manipulation;user-select:none;-webkit-user-select:none;
}
.btn:active,.btn.pressed{transform:translateY(3px);box-shadow:0 1px 0 var(--blood-dk)}
.btn:disabled{filter:grayscale(.8);opacity:.55;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--ink-2);box-shadow:none}
.btn.moss{background:linear-gradient(var(--moss-2),var(--moss));box-shadow:0 4px 0 #1f3a29}
.btn:focus-visible,.spot:focus-visible,.pick:focus-visible,.mud:focus-visible,.poop:focus-visible,.word:focus-visible,.padbtn:focus-visible{outline:3px solid var(--gold-2);outline-offset:3px}
.row{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;align-items:center}
.col{display:flex;flex-direction:column;gap:14px;align-items:center;width:100%}

/* Title */
.title-card{text-align:center;display:flex;flex-direction:column;gap:14px;align-items:center}
.title{font-family:var(--f-title);font-weight:400;font-size:clamp(46px,12vw,92px);line-height:.95;color:var(--blood);
  text-shadow:1px 1px 0 var(--gold), 3px 3px 0 rgba(42,28,18,.25)}
.title .n{display:block;font-size:.55em;color:var(--ink-2)}
.lede{max-width:52ch;margin:0;font-size:18px}
.lede em{color:var(--blood)}
.cast{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;width:100%;max-width:520px}
.cast div{display:flex;flex-direction:column;align-items:center;gap:2px;font-family:var(--f-sc);font-size:14px}
.cast span{font-size:34px;width:60px;height:60px;display:grid;place-items:center;border-radius:50%;
  background:var(--parch-3);box-shadow:inset 0 0 0 2px var(--ink-2), 0 0 0 3px var(--parch), 0 0 0 5px var(--gold)}
.field-label{font-family:var(--f-sc);letter-spacing:.08em;font-size:15px}
input[type=text]{font-family:var(--f-body);font-size:20px;text-align:center;padding:8px 12px;width:min(320px,100%);
  background:rgba(255,255,255,.35);color:var(--ink);border:none;border-bottom:2px solid var(--ink-2);border-radius:4px 4px 0 0}
input[type=text]:focus{outline:2px solid var(--gold);outline-offset:2px}
.record{margin:0;font-family:var(--f-sc);color:var(--ink-2);font-size:15px}

/* Instructions */
.howto{display:flex;flex-direction:column;gap:18px}
.howto h2{font-family:var(--f-title);font-weight:400;font-size:clamp(34px,8vw,52px);color:var(--blood);text-align:center}
.howto h3{font-family:var(--f-sc);font-weight:400;font-size:21px;letter-spacing:.06em;border-bottom:1px solid var(--parch-3);padding-bottom:4px;margin-bottom:8px}
.howto p{margin:0 0 6px;max-width:65ch}
.goal{font-size:19px}
.goal b{color:var(--blood)}
.quests{margin:0;padding-left:0;list-style:none;display:grid;grid-template-columns:1fr 1fr;gap:6px 18px;counter-reset:q}
.quests li{counter-increment:q;display:grid;grid-template-columns:28px 1fr;gap:8px;align-items:baseline}
.quests li::before{content:counter(q, upper-roman);font-family:var(--f-num);font-weight:700;color:var(--blood);font-size:14px;text-align:right}
.quests small{display:block;color:var(--ink-2);font-size:14px;line-height:1.3}
.foes{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.foe{display:grid;grid-template-columns:48px 1fr;gap:10px;align-items:start;padding:10px;border:1px solid var(--parch-3);border-radius:4px;background:rgba(255,255,255,.18)}
.foe .face{font-size:34px;line-height:48px;text-align:center}
.foe b{font-family:var(--f-sc);font-weight:400;font-size:17px;display:block}
.foe p{font-size:15px;margin:2px 0 0;line-height:1.3}
.foe .beat{color:var(--moss)}
.snooze-box{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center;padding:12px 14px;border:2px dashed var(--gold);border-radius:6px;background:rgba(210,166,71,.14)}
.snooze-box .bell{font-size:40px}
@media (max-width:560px){.quests,.foes{grid-template-columns:1fr}}

/* HUD */
.hud{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;
  background:linear-gradient(var(--stone-3),var(--stone-2));border:2px solid var(--gold);border-radius:6px;padding:8px 12px;
  box-shadow:0 8px 20px rgba(0,0,0,.5)}
.hud-lives{display:flex;gap:2px;font-size:24px;color:#e0473b;text-shadow:0 0 6px rgba(224,71,59,.5);min-width:90px}
.hud-lives.bump{animation:bump .5s}
.hud-time{font-family:var(--f-num);font-weight:900;font-size:28px;font-variant-numeric:tabular-nums;color:var(--gold-2);display:flex;align-items:center;gap:6px}
.hud-time.danger{color:#ff6a55;animation:pulse 1s infinite}
.hud-actions{display:flex;gap:8px}
.hud-btn{font-family:var(--f-num);font-weight:700;font-size:13px;letter-spacing:.05em;padding:8px 10px;border-radius:4px;cursor:pointer;
  background:var(--stone);color:var(--parch);border:1px solid var(--gold);touch-action:manipulation}
.hud-btn:focus-visible{outline:2px solid var(--gold-2);outline-offset:2px}
.hud-btn.snooze{background:linear-gradient(#5b4a1e,#3a2f12);color:var(--gold-2)}
.hud-btn.snooze b{display:inline-block;min-width:1.2em;background:var(--gold);color:var(--ink);border-radius:10px;padding:0 5px;margin-left:4px}
.hud-btn:disabled{opacity:.4;cursor:not-allowed}
@media (max-width:480px){.hud-time{font-size:24px}.hud-lives{font-size:20px;min-width:0}.hud-btn .lbl{display:none}}

/* Stage */
.stage{min-height:500px;display:flex;flex-direction:column;gap:12px;overflow:hidden;user-select:none;-webkit-user-select:none}
.track{display:flex;justify-content:space-between;gap:4px}
.track span{flex:1;text-align:center;font-size:18px;padding:4px 0;border-bottom:3px solid var(--parch-3);opacity:.45;filter:grayscale(1)}
.track span.done{opacity:1;filter:none;border-color:var(--moss)}
.track span.now{opacity:1;filter:none;border-color:var(--blood)}
.task-head{text-align:center;display:flex;flex-direction:column;gap:4px}
.task-head h2{font-family:var(--f-title);font-weight:400;font-size:clamp(30px,7vw,44px);color:var(--ink);line-height:1.05}
.how{margin:0 auto;max-width:52ch;font-size:16px;color:var(--ink-2);font-style:italic}
.arena{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;position:relative;min-height:280px}

.meter{position:relative;width:min(420px,100%);height:24px;border:2px solid var(--ink);border-radius:3px;background:var(--parch-3);overflow:hidden}
.meter i{position:absolute;left:0;top:0;bottom:0;width:0;background:repeating-linear-gradient(45deg,var(--gold) 0 10px,#c08f30 10px 20px)}
.meter .lbl{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--f-sc);font-size:14px;color:var(--ink);letter-spacing:.06em}
.big-emoji{font-size:84px;line-height:0;transition:transform .08s}
.mash{font-size:20px;padding:18px 28px;min-width:200px}
.side{min-width:130px}

/* Bed */
.alarm{font-family:var(--f-num);font-weight:900;color:var(--blood);font-size:22px;letter-spacing:.1em}
.alarm.ring{animation:shake .25s}

/* WhatsApp */
.phone{width:min(360px,100%);background:#1f2c2a;border:6px solid var(--ink);border-radius:22px;padding:12px;display:flex;flex-direction:column;gap:8px;min-height:150px}
.phone .top{font-family:var(--f-num);font-size:13px;color:#cfe;letter-spacing:.05em;display:flex;gap:8px;align-items:center}
.phone .top i{font-style:normal;width:26px;height:26px;border-radius:50%;background:var(--moss-2);display:grid;place-items:center;font-size:14px}
.bubble{align-self:flex-end;max-width:85%;background:#d9fdd3;color:#132;border-radius:10px 10px 2px 10px;padding:8px 10px;font-family:system-ui,sans-serif;font-size:15px;min-height:1.4em}
.bubble.them{align-self:flex-start;background:#fff;border-radius:10px 10px 10px 2px}
.bubble .caret{display:inline-block;width:2px;height:1em;background:#132;vertical-align:-2px;animation:blink 1s infinite}
.words{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;max-width:520px}
.word{font-family:var(--f-body);font-size:18px;padding:8px 12px;border-radius:4px;border:2px solid var(--ink-2);background:rgba(255,255,255,.45);color:var(--ink);cursor:pointer;touch-action:manipulation}
.word small{font-family:var(--f-num);font-size:11px;color:var(--blood);margin-right:6px}
.word.used{visibility:hidden}

/* Shower */
.tub{position:relative;width:min(440px,100%);height:250px;border:4px solid var(--ink);border-radius:8px;overflow:hidden;
  background:linear-gradient(#bfe0e8,#8cc3cf);}
.tub::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(100deg,transparent 0 18px,rgba(255,255,255,.35) 18px 20px);animation:rain .5s linear infinite}
.tub .knight{position:absolute;left:50%;bottom:-6px;transform:translateX(-50%);line-height:0}
.mud{position:absolute;border-radius:50%;border:none;cursor:pointer;touch-action:manipulation;
  background:radial-gradient(circle at 35% 35%,#8a6a3e,#5b3f1f 60%,#3e2a12);box-shadow:0 0 0 3px rgba(62,42,18,.35);animation:pop .18s}
.mud.gone{animation:bubble .3s forwards;pointer-events:none}

/* Dress / keys grid */
.ask{margin:0;font-size:19px;text-align:center}
.ask b{font-family:var(--f-sc);font-size:24px;color:var(--blood);font-weight:400}
.grid6{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:min(460px,100%)}
.pick,.spot{display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 6px;border-radius:6px;cursor:pointer;touch-action:manipulation;
  border:2px solid var(--ink-2);background:rgba(255,255,255,.4);color:var(--ink);font-family:var(--f-body);font-size:15px}
.pick .em,.spot .em{font-size:36px;line-height:1.1}
.pick small,.spot small{font-family:var(--f-num);font-size:11px;color:var(--blood)}
.pick.wrong{animation:shake .3s;background:rgba(179,54,44,.3)}

/* Pour */
.pour{display:flex;align-items:flex-end;gap:10px}
.pot{transform-origin:80% 80%;transition:transform .2s;line-height:0}
.pot.tilt{transform:rotate(-35deg) translate(10px,-10px)}
.cup{position:relative;width:120px;height:160px;border:5px solid var(--ink);border-top:none;border-radius:0 0 26px 26px;background:#f7efdd;overflow:hidden}
.cup .coffee{position:absolute;left:0;right:0;bottom:0;height:0;background:linear-gradient(#6b3f1d,#3b200d)}
.cup .zone{position:absolute;left:0;right:0;bottom:76%;height:15%;border-block:2px dashed var(--gold);background:rgba(210,166,71,.3);z-index:1}
.cup .zone::after{content:"aquí";position:absolute;right:4px;top:50%;transform:translateY(-50%);font-family:var(--f-sc);font-size:12px;color:var(--ink)}

/* Carry */
.hall{position:relative;width:min(440px,100%);height:90px;border-bottom:4px solid var(--ink);
  background:repeating-linear-gradient(90deg,transparent 0 38px,rgba(91,69,48,.25) 38px 40px)}
.walker{position:absolute;bottom:0;left:0;line-height:0}
.hall .door{position:absolute;right:0;bottom:0;font-size:60px;line-height:1}
.sp-walk{width:48px;height:76px}
.sp-cup{width:84px;height:90px}
.tcup{line-height:0;transition:transform .05s linear}
.balance{position:relative;width:min(420px,100%);height:24px;border:2px solid var(--ink);border-radius:12px;background:rgba(179,54,44,.35);overflow:hidden}
.balance .safe{position:absolute;left:22.5%;right:22.5%;top:0;bottom:0;background:rgba(61,106,76,.55)}
.balance i{position:absolute;top:2px;bottom:2px;width:14px;margin-left:-7px;left:50%;background:var(--ink);border-radius:7px}

/* Elevator */
.elev{display:flex;flex-direction:column;align-items:center;gap:8px}
.elev-display{font-family:var(--f-num);font-weight:900;font-size:28px;background:#120c08;color:#ff9a3c;padding:4px 16px;border-radius:4px;border:2px solid var(--gold);
  font-variant-numeric:tabular-nums;min-width:110px;text-align:center;text-shadow:0 0 8px rgba(255,154,60,.7)}
.elev-display small{font-size:.6em;margin-left:6px}
.doors{position:relative;width:170px;height:190px;border:6px solid var(--ink);border-bottom:none;background:#1b1410;overflow:hidden;border-radius:4px 4px 0 0}
.doors .inside{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--f-sc);font-size:18px;color:var(--ink);background:radial-gradient(#fbe3a0,#b88a3a)}
.door-l,.door-r{position:absolute;top:0;bottom:0;width:50%;background:linear-gradient(90deg,#7f8187,#caccd0 50%,#7f8187);transition:transform .35s ease;z-index:1}
.door-l{left:0;border-right:1px solid #444}.door-r{right:0;border-left:1px solid #444}
.doors.open .door-l{transform:translateX(-100%)}.doors.open .door-r{transform:translateX(100%)}
.elev-you{margin:0;font-family:var(--f-sc);color:var(--ink-2)}

/* Event overlay */
.event{position:absolute;inset:0;z-index:5;display:flex;align-items:center;justify-content:center;padding:12px;
  background:rgba(23,21,27,.78);backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px)}
.ev-card{width:100%;max-width:560px;max-height:100%;overflow:auto;border-radius:6px;padding:16px;color:var(--ink);
  background:linear-gradient(var(--parch),var(--parch-2));box-shadow:0 0 0 3px var(--blood),0 0 0 6px var(--gold),0 20px 40px rgba(0,0,0,.6);
  display:flex;flex-direction:column;gap:10px;animation:ambush .35s ease-out}
.ev-head{display:flex;gap:12px;align-items:center}
.ev-face{font-size:46px;width:66px;height:66px;flex:none;display:grid;place-items:center;border-radius:50%;background:var(--parch-3);box-shadow:inset 0 0 0 2px var(--blood)}
.ev-head h3{font-family:var(--f-title);font-weight:400;font-size:clamp(24px,6vw,32px);line-height:1.05}
.ev-line{margin:0;font-size:17px}
.ev-how{margin:0;font-size:15px;color:var(--moss);font-style:italic}
.ev-timer{height:10px;border:2px solid var(--ink);border-radius:5px;overflow:hidden;background:var(--parch-3)}
.ev-timer i{display:block;height:100%;width:100%;background:var(--blood-2)}
.field{position:relative;height:190px;border:2px dashed var(--parch-3);border-radius:6px;overflow:hidden}
.poop{position:absolute;width:58px;height:62px;border:none;background:none;cursor:pointer;touch-action:manipulation;padding:0;animation:pop .2s}
.poop.gone{animation:bubble .3s forwards;pointer-events:none}
.field .dog{position:absolute;right:4px;bottom:0;line-height:0;pointer-events:none}
.plea{font-family:var(--f-body);font-style:italic;font-size:19px;text-align:center;color:var(--blood);min-height:1.5em}
.field .yes{position:absolute;top:12px;left:50%;transform:translateX(-50%);font-size:17px;padding:14px 18px;white-space:nowrap}
.field .yes:active{transform:translateX(-50%) translateY(3px)}
.field .no{position:absolute;font-size:13px;padding:8px 10px;white-space:nowrap;transition:left .15s,top .15s}
.spot.wiggle{animation:wiggle .45s}
.spot.empty{opacity:.4}
.spot.found{background:rgba(92,148,112,.45);border-color:var(--moss)}
.seq{display:flex;gap:8px;justify-content:center}
.seq span{font-family:var(--f-num);font-weight:900;font-size:34px;width:52px;height:52px;display:grid;place-items:center;border:2px solid var(--ink-2);border-radius:6px;background:rgba(255,255,255,.4)}
.seq span.hit{background:var(--moss-2);color:#fff;border-color:var(--moss)}
.pad{display:flex;gap:10px;justify-content:center}
.padbtn{font-family:var(--f-num);font-weight:900;font-size:26px;width:64px;height:58px;border-radius:6px;border:2px solid var(--gold);cursor:pointer;touch-action:manipulation;
  background:linear-gradient(var(--blood-2),var(--blood));color:var(--parch);box-shadow:0 4px 0 var(--blood-dk)}
.padbtn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--blood-dk)}

/* Banner, toast, floats */
.banner{position:absolute;inset:0;z-index:4;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;
  background:linear-gradient(var(--parch),var(--parch-2));text-align:center;padding:16px}
.banner .num{font-family:var(--f-num);font-weight:900;color:var(--blood);letter-spacing:.2em;font-size:15px}
.banner .ic{font-size:64px}
.banner h2{font-family:var(--f-title);font-weight:400;font-size:clamp(34px,8vw,52px)}
.toast{position:absolute;left:50%;top:10px;transform:translate(-50%,-150%);z-index:6;max-width:calc(100% - 24px);width:max-content;
  padding:8px 14px;border-radius:4px;font-size:15px;text-align:center;transition:transform .25s;background:var(--ink);color:var(--parch);box-shadow:0 6px 16px rgba(0,0,0,.4)}
.toast.show{transform:translate(-50%,0)}
.toast.good{background:var(--moss)}
.toast.bad{background:var(--blood)}
.float{position:absolute;left:50%;top:45%;z-index:3;font-family:var(--f-num);font-weight:900;font-size:26px;color:var(--moss);pointer-events:none;
  animation:floatUp 1s forwards;text-shadow:0 2px 0 var(--parch);white-space:nowrap}
.float.bad{color:var(--blood)}
.shake{animation:shake .3s}

/* Pause */
.pause{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;background:rgba(10,8,12,.8);padding:16px}
.pause .parchment{text-align:center;display:flex;flex-direction:column;gap:14px;align-items:center;max-width:420px;width:100%}
.pause h2{font-family:var(--f-title);font-weight:400;font-size:48px;color:var(--blood)}

/* Endings */
.ending{display:flex;flex-direction:column;gap:14px;align-items:center;text-align:center}
.ending h2{font-family:var(--f-title);font-weight:400;font-size:clamp(38px,9vw,64px);color:var(--blood);line-height:1}
.ending .rank{font-family:var(--f-sc);font-size:22px;letter-spacing:.06em;color:var(--moss);margin:0}
.ending .scene{font-size:72px;line-height:1}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;width:100%;max-width:560px}
.stats div{display:flex;flex-direction:column;gap:2px;padding:10px 4px;border-top:2px solid var(--ink-2)}
.stats b{font-family:var(--f-num);font-weight:900;font-size:26px;font-variant-numeric:tabular-nums}
.stats span{font-family:var(--f-sc);font-size:13px;color:var(--ink-2)}
@media (max-width:480px){.stats{grid-template-columns:repeat(2,1fr)}}
.hist{width:100%;max-width:560px;display:flex;flex-direction:column;gap:6px}
.hist-head{margin:0;font-family:var(--f-sc);font-size:9px;line-height:1.7;color:var(--ink-2)}
.hist-avg{margin:0;font-size:21px}.hist-avg b{font-family:var(--f-num);font-size:15px;color:var(--blood)}
.hist-scroll{overflow-x:auto}
.hist table{width:100%;border-collapse:collapse;font-size:18px;font-variant-numeric:tabular-nums}
.hist th{font-family:var(--f-sc);font-size:8px;line-height:1.5;text-align:left;padding:4px 6px;border-bottom:2px solid var(--ink-2)}
.hist td{padding:3px 6px;border-bottom:1px solid var(--parch-3);text-align:left;white-space:nowrap}
.hist td.win{color:var(--moss)}.hist td.lose{color:var(--blood)}
.diff{display:flex;gap:10px;justify-content:center}
.road{position:relative;width:min(460px,100%);height:84px;border-bottom:6px solid var(--ink);overflow:hidden}
.road .car{position:absolute;bottom:-2px;line-height:0;animation:drive 2.6s ease-in forwards}

/* Sprites (animated SVG characters) */
.spr{display:block;overflow:visible;max-width:100%}
.spr *{transform-box:fill-box;transform-origin:center}
.cast span svg{width:54px;height:54px}
.ev-face svg,.foe .face svg{width:58px;height:58px}
.foe .face svg{width:48px;height:48px}
.banner .ic svg{width:120px;height:120px}
.ending .scene svg{width:130px;height:130px}
.sp-hero{width:150px;height:150px}
.sp-bed{width:240px;height:160px}
.sp-body{width:110px;height:175px}
.sp-small{width:64px;height:64px}
.bob{animation:bob 1.6s ease-in-out infinite}
.pupil{animation:look 3.2s ease-in-out infinite}
.pupil.shifty{animation:shifty .8s steps(2) infinite}
.pupil.jiggle{animation:jiggle .22s linear infinite}
.lid{transform:scaleY(0);animation:lidblink 4s infinite;transform-origin:center top}
.salo-row{display:flex;gap:10px;align-items:flex-end;justify-content:center}
.salo-row .grid6{flex:1}
.sp-salo{width:58px;height:112px}
@media (max-width:420px){.salo-full{display:none}}
.poop-svg{width:58px;height:66px}
.brush-svg{width:110px;height:28px}
.car-svg{width:150px;height:72px}
.wagtail{transform-origin:0% 100%;animation:wagtail .22s ease-in-out infinite alternate}
.tongue{transform-origin:center top;animation:tongue .35s ease-in-out infinite alternate}
.flop{animation:flop .5s ease-in-out infinite alternate}
.zzz{animation:zzz 2.4s ease-out infinite;opacity:0}
.zzz.d2{animation-delay:.8s}.zzz.d3{animation-delay:1.6s}
.breathe{transform-origin:center bottom;animation:breathe 2.4s ease-in-out infinite}
.stink{animation:stinkUp 1.4s ease-out infinite;opacity:0}
.stink.d2{animation-delay:.7s}
.squish{transform-origin:center bottom;animation:squish .6s ease-in-out infinite alternate}
.yell{animation:yell .18s ease-in-out infinite alternate}
.rage{animation:rage .12s linear infinite}
.tear{animation:tear 1.5s ease-in infinite}
.lip{animation:lip .12s linear infinite alternate}
.sparkle{animation:sparkle 1.2s ease-in-out infinite}
.swing{transform-origin:center top;animation:swing .9s ease-in-out infinite alternate}
.leg-l{transform-origin:center top;animation:stride .35s ease-in-out infinite alternate}
.leg-r{transform-origin:center top;animation:stride .35s ease-in-out infinite alternate-reverse}
.wheel{animation:spin .45s linear infinite}
.steam{animation:steam 2s ease-out infinite;opacity:0}
.steam.d2{animation-delay:.6s}.steam.d3{animation-delay:1.2s}
.foam{animation:foam .3s ease-in-out infinite alternate}
.bubbleUp{animation:bubbleUp 2s ease-in infinite;opacity:0}
.bubbleUp.d2{animation-delay:.7s}.bubbleUp.d3{animation-delay:1.4s}
.hop{animation:hop .5s ease-in-out infinite alternate}
@keyframes bob{50%{transform:translateY(-4px) rotate(-2deg)}}
@keyframes look{0%,40%{transform:translate(0,0)}50%,70%{transform:translate(3px,1px)}80%,95%{transform:translate(-3px,0)}}
@keyframes shifty{0%{transform:translateX(-4px)}100%{transform:translateX(4px)}}
@keyframes jiggle{0%{transform:translate(1px,-1px)}33%{transform:translate(-1.5px,1px)}66%{transform:translate(1px,1.5px)}100%{transform:translate(-1px,-1px)}}
@keyframes lidblink{0%,92%,100%{transform:scaleY(0)}95%{transform:scaleY(1)}}
@keyframes wagtail{from{transform:rotate(-18deg)}to{transform:rotate(22deg)}}
@keyframes tongue{from{transform:scaleY(.8)}to{transform:scaleY(1.25)}}
@keyframes flop{from{transform:rotate(-8deg)}to{transform:rotate(10deg)}}
@keyframes zzz{0%{opacity:0;transform:translate(0,0) scale(.6)}20%{opacity:1}100%{opacity:0;transform:translate(22px,-34px) scale(1.3)}}
@keyframes breathe{50%{transform:scaleY(1.06)}}
@keyframes stinkUp{0%{opacity:0;transform:translateY(4px)}30%{opacity:.9}100%{opacity:0;transform:translateY(-14px)}}
@keyframes squish{from{transform:scale(1.06,.94)}to{transform:scale(.95,1.06)}}
@keyframes yell{from{transform:scale(.8)}to{transform:scale(1.2,1.35)}}
@keyframes rage{0%{transform:translate(-1.5px,0)}50%{transform:translate(1.5px,-1px)}100%{transform:translate(-1px,1px)}}
@keyframes tear{0%{transform:translateY(0);opacity:0}15%{opacity:1}100%{transform:translateY(22px);opacity:0}}
@keyframes lip{from{transform:translateY(-.8px) rotate(-2deg)}to{transform:translateY(.8px) rotate(2deg)}}
@keyframes sparkle{50%{opacity:.3;transform:scale(.6)}}
@keyframes swing{from{transform:rotate(-20deg)}to{transform:rotate(20deg)}}
@keyframes stride{from{transform:rotate(-22deg)}to{transform:rotate(22deg)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes steam{0%{opacity:0;transform:translateY(6px)}30%{opacity:.8}100%{opacity:0;transform:translateY(-16px) scaleX(1.3)}}
@keyframes foam{from{transform:scale(.85)}to{transform:scale(1.15)}}
@keyframes bubbleUp{0%{opacity:0;transform:translateY(0)}20%{opacity:.9}100%{opacity:0;transform:translateY(-60px)}}
@keyframes hop{from{transform:translateY(0)}to{transform:translateY(-6px)}}

/* Elevator panel */
.panel{display:flex;flex-direction:column;align-items:center;gap:10px;padding:14px;border-radius:10px;width:min(380px,100%);
  background:linear-gradient(135deg,#b9bbc0,#7d8086 60%,#a4a6ab);border:4px solid var(--ink);box-shadow:inset 0 2px 0 rgba(255,255,255,.5)}
.keys{display:grid;grid-template-columns:repeat(6,1fr);gap:7px;width:100%}
.keys.park{grid-template-columns:repeat(5,1fr);padding-top:8px;border-top:2px dashed #3b3d42}
.fk{aspect-ratio:1;border-radius:50%;border:2px solid #3b3d42;background:radial-gradient(circle at 40% 35%,#fafafa,#b4b6bb);
  font-family:var(--f-num);font-weight:700;font-size:13px;color:#222;cursor:pointer;padding:0;touch-action:manipulation;transition:background .08s,box-shadow .08s}
.fk.park{background:radial-gradient(circle at 40% 35%,#fbe3a0,#c99a3a)}
.fk.target{outline:3px solid var(--blood);outline-offset:2px}
.fk.lit{background:radial-gradient(circle,#fff6c8,#ffae3c);box-shadow:0 0 14px 4px rgba(255,170,60,.95);color:#5a2b00}
.plabel{margin:0;font-family:var(--f-sc);color:#1b1410;font-size:14px;letter-spacing:.06em}

@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@keyframes bump{0%,100%{transform:scale(1)}40%{transform:scale(1.35)}}
@keyframes pulse{50%{opacity:.55}}
@keyframes blink{50%{opacity:0}}
@keyframes pop{from{transform:scale(0)}to{transform:scale(1)}}
@keyframes bubble{to{transform:scale(1.6);opacity:0}}
@keyframes rain{to{background-position:0 40px}}
@keyframes wiggle{0%,100%{transform:rotate(0)}20%{transform:rotate(-7deg)}40%{transform:rotate(6deg)}60%{transform:rotate(-4deg)}80%{transform:rotate(3deg)}}
@keyframes wag{to{transform:rotate(8deg)}}
@keyframes ambush{from{transform:scale(.85) rotate(-2deg);opacity:0}to{transform:none;opacity:1}}
@keyframes floatUp{from{transform:translate(-50%,0);opacity:1}to{transform:translate(-50%,-70px);opacity:0}}
@keyframes drive{from{left:-80px}to{left:110%}}
/* ===== Arcade pixel skin ===== */
:root{--f-title:'Jacquard 24','UnifrakturMaguntia',Georgia,serif;--f-body:'VT323','Courier New',monospace;--f-sc:'Press Start 2P','Courier New',monospace;--f-num:'Press Start 2P','Courier New',monospace}
*,*::before,*::after{border-radius:0!important}
body{font-size:21px;line-height:1.25;-webkit-font-smoothing:none}
body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:50;background:repeating-linear-gradient(0deg,rgba(0,0,0,.13) 0 2px,transparent 2px 4px)}
.parchment{box-shadow:0 0 0 4px var(--ink),0 0 0 8px var(--gold),8px 8px 0 8px rgba(0,0,0,.55)}
.eyebrow{font-size:9px;letter-spacing:.06em;line-height:1.7}
kbd{font-size:9px;padding:2px 4px;vertical-align:2px}
.btn{font-size:11px;letter-spacing:.02em;line-height:1.5;padding:14px 16px;box-shadow:4px 4px 0 var(--blood-dk)}
.btn:active,.btn.pressed{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--blood-dk)}
.btn.moss{box-shadow:4px 4px 0 #1f3a29}
.btn.ghost{box-shadow:4px 4px 0 var(--parch-3)}
.mash{font-size:13px}
.field .yes{font-size:10px;padding:12px}.field .yes:active{transform:translateX(-50%) translate(2px,2px)}
.field .no{font-size:8px}
.hud{box-shadow:6px 6px 0 rgba(0,0,0,.5)}
.hud-time{font-size:18px}
.hud-btn{font-size:9px;line-height:1.5}
.hud-lives{font-size:26px}
.title{font-size:clamp(56px,14vw,110px);line-height:.9;text-shadow:4px 4px 0 var(--gold),8px 8px 0 rgba(42,28,18,.25)}
.lede{font-size:23px}
.how{font-style:normal;font-size:20px}
.task-head h2,.banner h2,.ev-head h3,.howto h2,.ending h2,.pause h2{letter-spacing:.02em}
.quests li::before{font-size:10px}
.quests small{font-size:18px}
.howto h3{font-size:12px;line-height:1.6}
.foe b{font-size:10px;margin-bottom:4px}
.foe p{font-size:19px}
.field-label{font-size:10px}
input[type=text]{font-family:var(--f-num);font-size:13px;padding:12px}
.record{font-size:9px;line-height:1.7}
.meter .lbl{font-size:8px}
.ask{font-size:21px}.ask b{font-size:13px}
.pick,.spot{font-size:18px}.pick small,.spot small{font-size:8px}
.word{font-size:21px}.word small{font-size:8px}
.bubble{font-family:var(--f-body);font-size:20px}
.phone .top{font-size:8px}
.elev-display{font-size:18px;padding:8px 14px}
.fk{font-size:8px}
.plabel{font-size:9px}
.seq span{font-size:18px}.padbtn{font-size:18px;box-shadow:4px 4px 0 var(--blood-dk)}
.banner .num{font-size:11px}
.toast{font-size:19px}
.float{font-size:15px}
.stats b{font-size:15px}.stats span{font-size:8px;line-height:1.6}
.ending .rank{font-size:13px;line-height:1.6}
.alarm{font-size:14px}
.ev-line{font-size:21px}.ev-how{font-size:19px;font-style:normal}
.plea{font-style:normal;font-size:21px}
.cup .zone::after{font-size:7px}
.snooze-box{border-style:solid}
.ev-face,.cast span,.foe .face{overflow:hidden}
/* Pixelate every drawing (SVG filter, keeps the animations running) */
.hud-btn{font-size:10px;padding:9px 10px}

.spr.crop{overflow:hidden}
/* Pixelado de dibujos: solo en navegadores donde el filtro funciona (Chrome, Edge, Firefox).
   En Safari/iPhone se ven como dibujo normal para que nunca desaparezcan. */
html.pxok .spr{filter:url(#px)}
html.pxok .cast .spr,html.pxok .foe .spr,html.pxok .ev-face .spr,html.pxok .sp-walk,html.pxok .poop-svg,html.pxok .brush-svg,html.pxok .sp-salo{filter:url(#px3)}

/* ===== v11: iconos pixel, escenarios, efectos ===== */
.pi{display:inline-block;vertical-align:middle;image-rendering:pixelated;overflow:visible}
.rot-d{transform:rotate(180deg)}.rot-l{transform:rotate(-90deg)}.rot-r{transform:rotate(90deg)}
.btn .pi{width:14px;height:14px;vertical-align:-2px}
kbd.ka{display:inline-grid;place-items:center;padding:2px 3px;vertical-align:-1px}kbd.ka .pi{width:10px;height:10px}

/* HUD */
.hud{padding:6px 10px}
.hud-lives{gap:4px;align-items:center;min-height:28px}
.hud-lives .pi{width:26px;height:24px}
.hud-time{font-size:20px;gap:8px}
.hud-time .pi{width:18px;height:22px}
.hud-btn{display:inline-flex;align-items:center;gap:6px;min-height:38px}
.hud-btn.ic{min-width:40px;justify-content:center}
.hud-btn .pi{width:20px;height:18px}
.hud-btn.snooze .pi{width:20px;height:18px}

/* Barra de misiones */
.track{gap:6px}
.track span{position:relative;flex:1;display:grid;place-items:center;height:44px;padding:0;opacity:1;filter:none;
  background:rgba(255,255,255,.22);border:2px solid var(--parch-3);border-bottom-width:5px}
.track span .pi{width:24px;height:24px}
.track span:not(.done):not(.now) .pi{filter:grayscale(1);opacity:.45}
.track span.done{background:#cfe0c4;border-color:var(--moss)}
.track span.now{background:var(--parch);border-color:var(--blood);box-shadow:0 0 0 2px var(--gold);animation:nowbob .8s steps(2) infinite}
.track span .ck{position:absolute;right:-5px;top:-7px;width:14px;height:12px;display:none}
.track span.done .ck{display:block}
@keyframes nowbob{50%{transform:translateY(-3px)}}
@media (max-width:520px){.track{gap:3px}.track span{height:34px;border-width:2px 2px 4px}.track span .pi{width:18px;height:18px}}

/* Escenario detrás de cada misión */
.arena{border:4px solid var(--ink);padding:18px 12px;min-height:350px;background:#d8c39a;isolation:isolate;overflow:hidden;
  box-shadow:inset 0 0 0 3px rgba(255,255,255,.18)}
.arena>.bg{position:absolute;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
.arena>:not(.bg){position:relative;z-index:1}
.alarm,.ask,.elev-you{background:var(--parch);padding:6px 12px;box-shadow:0 0 0 3px var(--ink),4px 4px 0 3px rgba(0,0,0,.25)}
.alarm{display:flex;align-items:center;gap:8px}.alarm .pi{width:24px;height:24px}
.ask{max-width:min(460px,100%)}
.elev-you{font-size:10px;line-height:1.6}
.meter{background:#efe3c3;box-shadow:3px 3px 0 rgba(0,0,0,.25)}
.meter .lbl{display:flex;justify-content:center;align-items:center;gap:.6em;white-space:nowrap}
.word{background:#f6edd4;box-shadow:3px 3px 0 rgba(0,0,0,.2)}
.pick,.spot{background:#f6edd4;box-shadow:3px 3px 0 rgba(0,0,0,.2)}
.pick .em,.spot .em{height:44px;display:grid;place-items:center}
.pick .em .pi,.spot .em .pi{width:40px;height:40px}
.spot.found .em .pi{animation:popIn .35s steps(5)}
.balance{background:#e2b0a6}.balance .safe{background:#9cc8a6}
.hall{height:116px;background:linear-gradient(transparent calc(100% - 12px),#7a5a3e calc(100% - 12px));border-bottom:4px solid var(--ink)}
.hall .walker{bottom:6px}.hall .door{bottom:6px}
.sp-walk{width:62px;height:98px}
.hall .door{line-height:0}.hall .door .pi{width:48px;height:62px}
.sp-bed{width:300px;height:196px}
.pot .sp-small{width:104px;height:104px}
.sp-hero{width:170px;height:170px}
.sp-body{width:120px;height:190px}
@media (max-width:420px){.sp-bed{width:250px;height:164px}.arena{min-height:300px;padding:14px 8px}}

/* Flechas de Baba: todas del mismo dibujo y tamaño, solo giradas */
.seq span{width:54px;height:54px}
.seq span .pi,.padbtn .pi{width:28px;height:28px}
.seq span.hit .pi{filter:brightness(1.1)}
.padbtn{display:grid;place-items:center;width:66px;height:62px}
@media (max-width:420px){.seq{gap:5px}.seq span{width:44px;height:44px}.seq span .pi{width:22px;height:22px}.pad{gap:8px}.padbtn{width:58px;height:56px}}

/* Pantalla entre misiones */
.banner{background:repeating-conic-gradient(from 0deg at 50% 46%,rgba(210,166,71,.22) 0 9deg,transparent 9deg 18deg),linear-gradient(var(--parch),var(--parch-2))}
.banner:not([hidden]) .num{animation:dropIn .3s steps(4) both}
.banner:not([hidden]) .ic{animation:popIn .4s .08s steps(6) both}
.banner:not([hidden]) h2{animation:slam .4s .18s cubic-bezier(.3,1.7,.6,1) both}
.banner .ic .pi{width:96px;height:96px}
@keyframes dropIn{from{transform:translateY(-30px);opacity:0}}
@keyframes popIn{0%{transform:scale(0)}70%{transform:scale(1.15)}100%{transform:scale(1)}}
@keyframes slam{from{transform:scale(2.4);opacity:0}}

/* Efectos: destello, sello de "¡Hecho!", confeti, temblor */
.flash{position:absolute;inset:0;z-index:8;pointer-events:none;animation:flash .45s ease-out forwards}
.flash.good{background:rgba(240,207,122,.6)}
.flash.bad{background:rgba(179,54,44,.6)}
.flash.ambush{background:rgba(255,255,255,.75)}
@keyframes flash{to{opacity:0}}
.stamp{position:absolute;left:50%;top:44%;z-index:9;pointer-events:none;white-space:nowrap;
  font-family:var(--f-num);font-size:24px;color:var(--parch);background:var(--moss);padding:14px 18px;
  box-shadow:0 0 0 4px var(--ink),0 0 0 8px var(--gold),8px 8px 0 8px rgba(0,0,0,.35);
  transform:translate(-50%,-50%) rotate(-5deg);animation:stamp .85s forwards}
@keyframes stamp{0%{transform:translate(-50%,-50%) rotate(-5deg) scale(2.3);opacity:0}
  18%{transform:translate(-50%,-50%) rotate(-5deg) scale(.92);opacity:1}26%{transform:translate(-50%,-50%) rotate(-5deg) scale(1)}
  80%{opacity:1}100%{transform:translate(-50%,-60%) rotate(-5deg) scale(1);opacity:0}}
.conf{position:absolute;left:50%;top:44%;z-index:8;width:8px;height:8px;background:var(--c);pointer-events:none;animation:conf .9s ease-out forwards}
@keyframes conf{60%{transform:translate(var(--dx),var(--dy)) rotate(var(--r));opacity:1}
  100%{transform:translate(calc(var(--dx) * 1.15),calc(var(--dy) + 70px)) rotate(var(--r));opacity:0}}
.quake{animation:quake .4s steps(8)}
@keyframes quake{0%,100%{transform:none}12%{transform:translate(-6px,3px)}25%{transform:translate(5px,-4px)}37%{transform:translate(-4px,-2px)}
  50%{transform:translate(4px,3px)}62%{transform:translate(-3px,1px)}75%{transform:translate(2px,-2px)}87%{transform:translate(-1px,1px)}}
.stage.danger::after{content:"";position:absolute;inset:0;z-index:3;pointer-events:none;
  box-shadow:inset 0 0 0 4px var(--blood-2),inset 0 0 70px rgba(179,54,44,.45);animation:pulse 1s infinite}

/* Emboscada: franjas de alerta y entrada más dramática */
.event{background:repeating-linear-gradient(-45deg,rgba(77,16,13,.86) 0 22px,rgba(23,21,27,.86) 22px 44px);background-size:62.2px 62.2px;animation:stripes .8s linear infinite}
@keyframes stripes{to{background-position:62.2px 0}}
.ev-card{animation:ambushIn .45s cubic-bezier(.3,1.5,.6,1)}
@keyframes ambushIn{0%{transform:translateY(-60px) scale(.8) rotate(-3deg);opacity:0}100%{transform:none;opacity:1}}
.ev-head .eyebrow{animation:blink .5s steps(1) 3}
.snooze-box .bell .pi{width:44px;height:40px}
.title-card .orn{color:var(--parch-3)}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
  .road .car{animation:none;left:40%}
}
</style>
</head>
<body>

<div id="app">
  <header id="hud" class="hud" hidden>
    <div id="lives" class="hud-lives" aria-label="Vidas"></div>
    <div id="timeBox" class="hud-time" aria-label="Tiempo restante"><span class="hg" id="hg"></span><span id="time">3:00</span></div>
    <div class="hud-actions">
      <button id="snoozeBtn" class="hud-btn snooze" title="Posponer (Z): +1 vida, −45 s"><span id="snzIc"></span><span class="lbl">Posponer</span><b id="snoozeN">1</b></button>
      <button id="muteBtn" class="hud-btn ic" aria-label="Silenciar o activar el sonido"></button>
      <button id="pauseBtn" class="hud-btn ic" aria-label="Pausa (P)"></button>
    </div>
  </header>
  <main id="screen"></main>
</div>

const sleepy=(x,y,k=1)=>`<path d="M${x-8*k} ${y} q${8*k} ${6*k} ${16*k} 0" fill="none" ${ST}/>`;

/* ================= ICONOS PIXEL (reemplazan los emojis) ================= */
// Cada icono es un mapa de caracteres; cada letra es un color de PAL y "." es transparente.
const PAL={k:'#2a1c12',w:'#ffffff',W:'#f7efdd',P:'#ecdfbd',r:'#c0392b',R:'#8b2420',g:'#d2a647',G:'#f0cf7a',b:'#8a5a2e',B:'#5b3f1f',
  s:'#f0c69b',c:'#9fd3de',C:'#3d86a8',m:'#5c9470',M:'#3d6a4c',a:'#b9bbc0',A:'#6f7177',p:'#e8607a',n:'#2f3a52',o:'#ff9a3c',l:'#8a76b0',e:'#5a5262',t:'#c7ad74'};
function pix(rows,cls='pi',pal={}){
  const P={...PAL,...pal}, w=Math.max(...rows.map(r=>r.length)); let s='';
  rows.forEach((row,y)=>{let x=0;while(x<row.length){const c=row[x];if(!P[c]){x++;continue}let e=x;while(row[e+1]===c)e++;
    s+=`<rect x="${x}" y="${y}" width="${e-x+1}" height="1" fill="${P[c]}"/>`;x=e+1}});

const SND=(()=>{
  let ctx,master,music,sfx,noiseBuf,drone=[],timer=null,step=0,next=0,playing=false,tempo=1;
  let muted=store.get('nmp-muted',false);
  const SEM={C:0,D:2,E:4,F:5,G:7,A:9,B:11};
  const hz=n=>{const sharp=n[1]==='#';const oct=+n.slice(sharp?2:1);return 440*Math.pow(2,(12*(oct+1)+SEM[n[0]]+(sharp?1:0)-69)/12)};
  // Jig in D dorian, 6/8, 8 bars
  const MEL=('D5 A4 D5 E5 F5 E5  D5 C5 A4 G4 A4 C5  D5 A4 D5 F5 G5 A5  G5 F5 E5 D5 - -  '+
             'F5 G5 A5 A5 G5 F5  E5 D5 C5 D5 E5 C5  A4 C5 D5 E5 F5 E5  D5 C5 A4 D5 - -').trim().split(/\s+/);
  const BASS='D3 A2 C3 G2 D3 A2 G2 A2 F2 C3 C3 G2 A2 A2 D3 D3'.split(' ');
  let unlock=null;
  function init(){
    // iPhone: que el audio suene aunque el switch de silencio esté activado
    try{if(navigator.audioSession)navigator.audioSession.type='playback'}catch(e){}
    try{if(!unlock){unlock=new Audio('data:audio/wav;base64,UklGRkQDAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YSADAACAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgA==');unlock.loop=true;unlock.volume=.01}unlock.play().catch(()=>{})}catch(e){}
    if(ctx){if(ctx.state!=='running')ctx.resume();return}
    const AC=window.AudioContext||window.webkitAudioContext; if(!AC) return;
    ctx=new AC(); if(ctx.state!=="running")ctx.resume();
    master=ctx.createGain(); master.gain.value=muted?0:.9; master.connect(ctx.destination);
    music=ctx.createGain(); music.gain.value=.3; music.connect(master);
    sfx=ctx.createGain(); sfx.gain.value=.55; sfx.connect(master);
    noiseBuf=ctx.createBuffer(1,ctx.sampleRate*.5,ctx.sampleRate);
    const d=noiseBuf.getChannelData(0); for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1;
  }
  function tone(f,t,dur,o={}){
    if(!ctx) return;
    const {type='triangle',vol=.3,dest=sfx,attack=.005,cut=null,glide=null}=o;
    const osc=ctx.createOscillator(), g=ctx.createGain();
    osc.type=type; osc.frequency.setValueAtTime(f,t);
    if(glide) osc.frequency.exponentialRampToValueAtTime(glide,t+dur);
    g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(vol,t+attack); g.gain.exponentialRampToValueAtTime(.0001,t+dur);
    let n=osc; if(cut){const fl=ctx.createBiquadFilter();fl.type='lowpass';fl.frequency.value=cut;osc.connect(fl);n=fl}
    n.connect(g); g.connect(dest); osc.start(t); osc.stop(t+dur+.05);
  }
  function noise(t,dur,o={}){
    if(!ctx) return;
    const {vol=.2,freq=6000,type='highpass',dest=sfx,q=1}=o;
    const s=ctx.createBufferSource(); s.buffer=noiseBuf;
    const f=ctx.createBiquadFilter(); f.type=type; f.frequency.value=freq; f.Q.value=q;
    const g=ctx.createGain(); g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(.0001,t+dur);
    s.connect(f); f.connect(g); g.connect(dest); s.start(t); s.stop(t+dur+.02);
  }
  const pluck=(f,t,dur,vol)=>{tone(f,t,dur*.8,{type:'square',vol:vol*.45,dest:music,cut:4200});tone(f,t,dur,{type:'triangle',vol:vol*.5,dest:music})};
  function schedule(){
    while(next<ctx.currentTime+.15){
      const i=step%MEL.length, e=.2/tempo, n=MEL[i];
      if(n!=='-'){let len=1;while(MEL[(i+len)%MEL.length]==='-'&&len<3)len++;pluck(hz(n),next,e*len*1.7,.18)}
      if(i%3===0){pluck(hz(BASS[i/3]),next,e*3.3,.22);noise(next,.05,{vol:.07,freq:7000,dest:music})}
      if(i%6===0) tone(120,next,.2,{type:'sine',vol:.35,dest:music,glide:45});
      if(i%6===4) noise(next,.04,{vol:.035,freq:8500,dest:music});
      step++; next+=e;
    }
  }
  function startDrone(){
    [hz('D3'),hz('A3')].forEach(f=>{
      const o=ctx.createOscillator(),fl=ctx.createBiquadFilter(),g=ctx.createGain();
      o.type='sawtooth';o.frequency.value=f;fl.type='lowpass';fl.frequency.value=420;g.gain.value=.028;
      o.connect(fl);fl.connect(g);g.connect(music);o.start();drone.push(o);
    });
  }
  function stopDrone(){drone.forEach(o=>{try{o.stop()}catch(e){}});drone=[]}
  const now=()=>ctx?ctx.currentTime:0;
  return {
    init,
    get muted(){return muted},
    toggle(){muted=!muted;store.set('nmp-muted',muted);if(master)master.gain.value=muted?0:.9;return muted},
    startMusic(){init();if(!ctx||playing)return;playing=true;step=0;tempo=1;next=ctx.currentTime+.1;startDrone();timer=setInterval(schedule,25)},
    stopMusic(){playing=false;clearInterval(timer);timer=null;if(ctx)stopDrone()},
    setTempo(t){tempo=t},
    tap(){tone(rand(820,980),now(),.07,{vol:.14})},
    good(){const t=now();tone(hz('A5'),t,.15,{vol:.2});tone(hz('D6'),t+.09,.35,{vol:.2})},
    bad(){tone(140,now(),.25,{type:'square',vol:.12,cut:900})},
    hurt(){tone(420,now(),.45,{type:'sawtooth',vol:.16,glide:110,cut:1500})},
    snooze(){const t=now();tone(1046,t,1.4,{type:'sine',vol:.22});tone(1568,t,1,{type:'sine',vol:.09});tone(2637,t,.5,{type:'sine',vol:.04})},
    alarm(){tone(1320,now(),.08,{type:'square',vol:.06})},
    bark(){const t=now();[0,.2].forEach(d=>{noise(t+d,.12,{type:'bandpass',freq:800,q:2,vol:.7});tone(520,t+d,.11,{type:'sawtooth',vol:.14,glide:230,cut:1200})})},
    mom(){const t=now();tone(250,t,.8,{type:'sawtooth',vol:.12,glide:430,cut:1500});tone(330,t+.85,.35,{type:'sawtooth',vol:.1,glide:280,cut:1500})},

/* ================= TASKS (minigames) ================= */
function holdable(btn,onDown,onUp){
  btn.addEventListener('pointerdown',e=>{e.preventDefault();btn.classList.add('pressed');onDown()});
  ['pointerup','pointerleave','pointercancel'].forEach(ev=>btn.addEventListener(ev,()=>{if(btn.classList.contains('pressed')){btn.classList.remove('pressed');onUp()}}));
  btn.addEventListener('contextmenu',e=>e.preventDefault());
}
function mashable(btn,fn){
  btn.addEventListener('pointerdown',e=>{e.preventDefault();btn.classList.add('pressed');fn()});
  ['pointerup','pointerleave','pointercancel'].forEach(ev=>btn.addEventListener(ev,()=>btn.classList.remove('pressed')));
}

         if(state==='coming'&&t>.3){t=0;floor+=floor>MY?-1:1;SND.tick();show();if(floor===MY){state='open';t=0;dr.classList.add('open');SND.ding();eb.textContent='¡Entrar!'}}
         else if(state==='open'&&t>1.4){state='idle';dr.classList.remove('open');floor=pickStart();show();eb.textContent='Llamar elevador';SND.bad();api.float('Se cerró… lo llamaron de arriba','bad')}
       },
       key(e){if((e.code==='Space'||e.code==='Enter')&&!e.repeat)act()}
     };
   }},
  {icon:'parking',scene:()=>BG.elevator(),title:'Bajar al E2',
   how:()=>'El elevador baja desde el 21. Presiona <kbd>Espacio</kbd>, «¡Alto!» o cualquier botón del tablero justo cuando se ilumine el <b>E2</b>. En los estacionamientos baja más lento. '+(DF().e2Miss==='life'?'Si fallas, pierdes 1 vida.':'Si fallas, pierdes 5 segundos.'),
   mount(a,api){
     const F=['PH',...Array.from({length:25},(_,i)=>String(25-i)),'E1','E2','E3','E4','E5'];
     const START=F.indexOf('21'), TARGET=F.indexOf('E2'), PARK=F.indexOf('E1'), RETRY=F.indexOf('4');
     const key=(f,i)=>`<button class="fk${i>=PARK?' park':''}${i===TARGET?' target':''}" data-i="${i}" aria-label="Piso ${f}">${f}</button>`;
     a.innerHTML=`<div class="panel"><div class="elev-display"><span id="pfl">21</span><small>▼</small></div>
       <div class="keys">${F.slice(0,PARK).map(key).join('')}</div>
       <p class="plabel">Estacionamiento</p>
       <div class="keys park">${F.slice(PARK).map((f,j)=>key(f,PARK+j)).join('')}</div></div>
       <button class="btn mash" id="stopB">¡Alto!</button>`;
     const keys=[...a.querySelectorAll('.fk')], pfl=$('#pfl',a);
     let pos=START,t=0,state='down',wait=0,done=false;
     const paint=()=>{keys.forEach((k,i)=>k.classList.toggle('lit',i===pos));pfl.textContent=F[pos]};
     paint();
     const K=DF(), speed=i=>i>=PARK?K.e2Speed:.12;
     const miss=msg=>{state='wrong';wait=1.2;if(K.e2Miss==='life')api.hurt(msg);else{SND.bad();api.float(msg,'bad');S.time-=5}};
     const stop=()=>{
       if(done||state!=='down')return;
       if(pos===TARGET){done=true;SND.ding();api.done()}
       else miss(pos<TARGET?`Esto es ${F[pos]}: aquí no está el coche`:`Te pasaste: esto es ${F[pos]}`);
     };
     mashable($('#stopB',a),stop);
     keys.forEach(k=>k.addEventListener('pointerdown',e=>{e.preventDefault();stop()}));
     return {
       tick(dt){
         if(done)return;
         if(state==='wrong'){wait-=dt;if(wait<=0){pos=RETRY;state='down';t=0;paint()}return}
         t+=dt;
         if(t>=speed(pos)){t=0;
           if(pos>=F.length-1){miss('Llegaste al E5: el coche está en el E2');return}
           pos++;SND.tick();paint()}
       },
       key(e){if((e.code==='Space'||e.code==='Enter')&&!e.repeat)stop()}
     };
   }}
];

function startGame(){
  SND.init();
  S={time:TOTAL,lives:START_LIVES,snoozes:MAX_SNOOZE,taskIdx:-1,task:null,event:null,running:true,paused:false,
     diff:chosenDiff,nextEvent:rand(DIFF[chosenDiff].first[0],DIFF[chosenDiff].first[1]),queue:shuffle(Object.keys(EVENTS)),lastEv:null,timers:[],stats:{events:0,won:0},hud:{}};
  hud.hidden=false;
  screen.innerHTML=`<section class="parchment stage" id="stage">
    <div class="track" id="track">${TASKS.map(t=>`<span title="${t.title}">${ico(t.icon)}${ico('check','pi ck')}</span>`).join('')}</div>
    <div class="task-head"><p class="eyebrow" id="tEy"></p><h2 id="tTi"></h2><p class="how" id="tHow"></p></div>
    <div class="arena" id="arena"></div>

function renderTrack(){
  [...$('#track').children].forEach((s,i)=>{s.className=i<S.taskIdx?'done':i===S.taskIdx?'now':''});
}

function nextTask(){
  S.taskIdx++; S.task=null;
  const T=TASKS[S.taskIdx];
  renderTrack();
  const b=$('#banner');
  b.innerHTML=`<span class="num">MISIÓN ${S.taskIdx+1} DE ${TASKS.length}</span><span class="ic">${T.art?T.art():ico(T.icon)}</span><h2>${T.title}</h2>`;
  b.hidden=false;
  later(1.1,()=>{b.hidden=true;mountTask(T)});
}

function mountTask(T){
  $('#tEy').textContent=`Misión ${S.taskIdx+1} de ${TASKS.length}`;
  $('#tTi').textContent=T.title;
  $('#tHow').innerHTML=val(T.how);
  const arena=$('#arena'); arena.innerHTML='';
  const bg=T.scene?T.scene():'';
  let finished=false, ctl={};
  const run=S;
  const api={
    done(){if(finished||S!==run||!S.running)return;finished=true;S.task=null;SND.good();celebrate('¡Hecho!');
      later(.8,()=>S.taskIdx>=TASKS.length-1?win():nextTask())},
    lock(){if(S.task===ctl)S.task=null},
    float, penalty(sec){S.time-=sec;float(`−${sec} s`,'bad')},
    hurt(msg){if(S!==run||!S.running)return;float('−1 ♥','bad');loseLife(msg,{title:'tu propia torpeza',art:()=>SPR.cup('')})}
  };
  ctl=T.mount(arena,api)||{};
  if(bg) arena.insertAdjacentHTML('afterbegin',bg);
  if(!finished) S.task=ctl;
}

function float(text,cls='good'){
  const st=$('#stage'); if(!st) return;
  const f=document.createElement('span'); f.className='float '+cls; f.textContent=text;
  st.append(f); f.addEventListener('animationend',()=>f.remove());
  setTimeout(()=>f.remove(),1500);
}
function fx(kind){
  const st=$('#stage'); if(!st) return;
  const f=document.createElement('div'); f.className='flash '+kind; st.append(f); setTimeout(()=>f.remove(),500);
}
function quake(){const a=$('#app');a.classList.remove('quake');void a.offsetWidth;a.classList.add('quake')}
function celebrate(text){
  const st=$('#stage'); if(!st) return;
  fx('good');
  const s=document.createElement('div'); s.className='stamp'; s.textContent=text; st.append(s); setTimeout(()=>s.remove(),900);
  const C=['#d2a647','#f0cf7a','#5c9470','#b3362c','#9fd3de','#f7efdd'];
  for(let i=0;i<18;i++){
    const c=document.createElement('i'),a=rand(0,Math.PI*2),d=rand(70,170);
    c.className='conf'; c.style.cssText=`--c:${C[i%C.length]};--dx:${Math.cos(a)*d}px;--dy:${Math.sin(a)*d-40}px;--r:${randi(-2,2)*90}deg`;
    st.append(c); setTimeout(()=>c.remove(),950);
  }
}
let toastT;
function toast(msg,cls=''){
  const t=$('#toast'); if(!t) return;
  t.textContent=msg; t.className='toast show '+cls;
  clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('show'),2600);
}

/* ================= EVENTS FLOW ================= */
// Tempo de la música: +6% por misión (misión 1 = 100%, misión 9 = 148%).
// Encima de eso, las emboscadas aceleran ×1.2 y los últimos 30 s ×1.1.
const TEMPO_STEP=.06;
function musicTempo(ambush){
  const base=1+TEMPO_STEP*Math.max(0,S.taskIdx);
  return base*(ambush?1.2:1)*(S.time<30?1.1:1);
}
function startEvent(){
  if(!S.queue.length) S.queue=shuffle(Object.keys(EVENTS).filter(k=>k!==S.lastEv));
  const key=S.queue.shift(); S.lastEv=key; const D=EVENTS[key];
  S.task?.interrupt?.();
  const el=$('#event');
  el.innerHTML=`<div class="ev-card" role="alertdialog" aria-label="${D.title}">
    <div class="ev-head"><span class="ev-face">${D.art()}</span><div><p class="eyebrow">¡Emboscada!</p><h3>${D.title}</h3></div></div>
    <p class="ev-line">${D.line}</p><p class="ev-how" id="evHow">${val(D.how)}</p>
    <div class="ev-timer"><i id="evBar"></i></div>
    <div id="evBody"></div></div>`;
  el.hidden=false; fx('ambush'); quake();
  let resolved=false;
  const api={
    win(m){if(resolved)return;resolved=true;endEvent(true,m,D)},
    fail(m){if(resolved)return;resolved=true;endEvent(false,m,D)},
    note(m){const h=$('#evHow');if(h)h.textContent=m}
  };
  const dur=DF().dur[D.key]*(1-DF().scale*S.taskIdx/(TASKS.length-1));
  S.event={D,dur,left:dur,api,ctl:{}};
  S.event.ctl=D.mount($('#evBody'),api)||{};
  S.stats.events++;
  SND.setTempo(musicTempo(true));
}
function endEvent(ok,msg,D){
  S.event=null;
  const el=$('#event'); el.hidden=true; el.innerHTML='';
  SND.setTempo(musicTempo(false));
  {const K=DF();S.nextEvent=Math.random()<K.double?rand(2.5,4):rand(K.gap[0],K.gap[1])}
  if(ok){S.stats.won++;SND.good();toast(msg,'good');fx('good')}
  else loseLife(msg,D);
}
function loseLife(msg,D){
  S.lives--; S.stats.lost=(S.stats.lost||0)+1; SND.hurt(); toast(`${msg} −1 vida`,'bad');
  const l=$('#lives'); l.classList.remove('bump'); void l.offsetWidth; l.classList.add('bump');
  fx('bad'); quake();
  renderHUD(true);
  if(S.lives<=0) endGame('lives',D);
}

function snooze(){
  if(!S||!S.running||S.paused||S.snoozes<=0||S.time<=SNOOZE_COST+1) return;
  S.snoozes--; S.time-=SNOOZE_COST; S.lives=Math.min(MAX_LIVES,S.lives+1);
  SND.snooze(); toast('Zzz… «Cinco minutitos más»: +1 vida, −45 segundos');
  float('+1 ♥  −45 s','good'); renderHUD(true);
}
function togglePause(force){
  if(!S||!S.running) return;
  S.paused=force!==undefined?force:!S.paused;
  $('#pause').hidden=!S.paused;
  if(S.paused){SND.stopMusic();S.task?.interrupt?.();$('#resumeBtn').focus()}
  else SND.startMusic();
}
$('#snoozeBtn').onclick=snooze;
$('#pauseBtn').onclick=()=>togglePause();
$('#resumeBtn').onclick=()=>togglePause(false);

muteBtn.onclick=()=>{SND.toggle();paintMute()};
paintMute();

function renderHUD(force){

/* ================= HISTORIAL DE PARTIDAS ================= */
const HIST_KEY='nmp-historial', HIST_MAX=20;
function saveRun(won){
  const hist=store.get(HIST_KEY,[]);
  const list=Array.isArray(hist)?hist:[];
  list.push({fecha:new Date().toISOString(),dificultad:S.diff,gano:won,vidasPerdidas:S.stats.lost||0,
    segundos:Math.max(0,Math.ceil(S.time)),snooze:S.snoozes<MAX_SNOOZE});
  // Mientras haya más de 20 partidas, borra la más antigua
  while(list.length>HIST_MAX) list.shift();
  store.set(HIST_KEY,list);
}
function historyHTML(){
  const all=store.get(HIST_KEY,[]);
  const cur=DF().name, key=(S&&S.diff)||chosenDiff;
  const list=Array.isArray(all)?all.filter(p=>(p.dificultad||'hard')===key):[];
  if(!list.length) return `<p class="record">Aún no hay historial en modo ${cur}</p>`;
  // Para cada partida: suma sus vidas perdidas y, si ganó, cuenta la victoria
  let vidas=0, victorias=0;
  for(const p of list){ vidas+=p.vidasPerdidas||0; if(p.gano) victorias++; }
  const prom=vidas/list.length;
  let msg;
  if(prom<1) msg='El juego está muy fácil';
  else if(prom<=1.5) msg='Dificultad justa';
  else msg='El juego está muy difícil';
  const rows=list.slice(-5).reverse().map(p=>{
    const d=new Date(p.fecha);
    return `<tr><td>${d.toLocaleDateString('es-MX',{day:'2-digit',month:'2-digit'})} ${d.toLocaleTimeString('es-MX',{hour:'2-digit',minute:'2-digit'})}</td><td class="${p.gano?'win':'lose'}">${p.gano?'Ganó':'Perdió'}</td><td>${p.vidasPerdidas}</td><td>${fmt(p.segundos)}</td><td>${p.snooze?'Sí':'No'}</td></tr>`;
  }).join('');
  return `<div class="hist">
    <p class="hist-head">Historial modo ${cur} · ${list.length} ${list.length===1?'partida':'partidas'} · ${victorias} ${victorias===1?'victoria':'victorias'}</p>
    <p class="hist-avg"><b>${prom.toFixed(2)}</b> vidas perdidas en promedio: ${msg}</p>
    <div class="hist-scroll"><table><thead><tr><th>Fecha</th><th>Resultado</th><th>Vidas perdidas</th><th>Tiempo</th><th>Snooze</th></tr></thead><tbody>${rows}</tbody></table></div>
  </div>`;
}

function endGame(kind,D){
  if(!S.running) return;
  saveRun(false);
  S.running=false; S.task=null; S.event=null;
  SND.stopMusic(); SND.sad();
  hud.hidden=true;
  const name=esc(playerName());
  const title=kind==='time'?'Se te hizo tarde':'La mañana te venció';
  const text=kind==='time'
    ?`El reloj de arena se vació, ${name}. Naye ya se tomó tu licuado.`
    :`Te quedaste sin vidas, ${name}. El golpe final te lo dio <b>${D?D.title:'la almohada'}</b>.`;
  screen.innerHTML=`<section class="parchment ending">
    <p class="eyebrow">Fin de la gesta</p>
    <div class="scene" aria-hidden="true">${kind==='time'?SPR.bed():(D?D.art():SPR.bed())}</div>
    <h2>${title}</h2>
    <p style="margin:0;max-width:48ch">${text}</p>
    <div class="stats">
      <div><b>${S.taskIdx}/${TASKS.length}</b><span>Misiones</span></div>
      <div><b>${S.stats.won}/${S.stats.events}</b><span>Emboscadas</span></div>
      <div><b>${MAX_SNOOZE-S.snoozes}</b><span>Posposiciones</span></div>
      <div><b>${fmt(S.time)}</b><span>Tiempo</span></div>
    </div>
    ${historyHTML()}
    <div class="row"><button class="btn" id="again">Intentarlo otra vez</button><button class="btn ghost" id="menu">Menú</button></div>
  </section>`;
  $('#again').onclick=startGame; $('#menu').onclick=showTitle;
}

function win(){
  S.running=false; S.task=null;
  saveRun(true);
  SND.stopMusic();
  hud.hidden=true;
  const left=Math.max(0,Math.ceil(S.time));
  screen.innerHTML=`<section class="parchment ending">
    <p class="eyebrow">Escena final</p>
    <h2>Estacionamiento E2</h2>
    <div class="elev"><div class="elev-display"><span>E2</span></div>
      <div class="doors" id="fdr"><div class="door-l"></div><div class="door-r"></div><div class="inside">${SPR.car()}</div></div></div>
    <p class="muted" style="margin:0">Se abren las puertas… y ahí está el coche.</p>
  </section>`;
  setTimeout(()=>{const d=$('#fdr');if(d)d.classList.add('open')},350);
  setTimeout(()=>{if($('#fdr'))showVictory(left)},2000);
}
function showVictory(left){
  const best=store.get('nmp-best',null), isBest=best==null||left>best;
  if(isBest) store.set('nmp-best',left);
  const rank=left>=60?'Madrugador Legendario':left>=30?'Caballero Puntual':'Sobreviviente de la Mañana';
  const name=esc(playerName());
  SND.fanfare();
  screen.innerHTML=`<section class="parchment ending">
    <p class="eyebrow">¡Victoria!</p>
    <h2>Llegaste al coche</h2>
    <div class="road" aria-hidden="true"><span class="car">${SPR.car()}</span></div>
    <p class="rank">${rank}</p>
    <p style="margin:0;max-width:48ch">Bien hecho, ${name}. Bañado, vestido, con café en mano y el licuado de Naye en camino. La mañana no pudo contigo… esta vez.</p>
    <div class="stats">
      <div><b>${fmt(left)}</b><span>De sobra</span></div>
      <div><b>${S.lives}</b><span>Vidas</span></div>
      <div><b>${S.stats.won}/${S.stats.events}</b><span>Emboscadas</span></div>
      <div><b>${MAX_SNOOZE-S.snoozes}</b><span>Posposiciones</span></div>
    </div>
    <p class="record">${isBest?'¡Nueva mejor marca!':`Tu mejor marca: ${fmt(best)} de sobra`}</p>
    ${historyHTML()}
    <div class="row"><button class="btn" id="again">Jugar otra vez</button><button class="btn ghost" id="menu">Menú</button></div>
  </section>`;
  $('#again').onclick=startGame; $('#menu').onclick=showTitle;
}

/* ================= INPUT ================= */
addEventListener('keydown',e=>{
  if(!S||!S.running) return;
  if(e.target&&e.target.tagName==='INPUT') return;
  if(e.code==='KeyP'||e.code==='Escape'){e.preventDefault();togglePause();return}
  if(S.paused) return;
  if(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code)) e.preventDefault();
  if(e.code==='KeyZ'&&!e.repeat){snooze();return}
  const tgt=S.event?S.event.ctl:S.task;
  tgt?.key?.(e);
});
addEventListener('keyup',e=>{
  if(!S||!S.running) return;
  if(e.code==='Space') e.preventDefault();
  const tgt=S.event?S.event.ctl:S.task;
  tgt?.keyup?.(e);
});

/* ================= LOOP ================= */
let last=performance.now();
function frame(now){
  const dt=Math.min(.05,(now-last)/1000); last=now;
  if(S&&S.running&&!S.paused) step(dt);
  requestAnimationFrame(frame);
}
function step(dt){
  S.time-=dt;
  if(S.time<=0){S.time=0;renderHUD(true);endGame('time');return}
  for(let i=S.timers.length-1;i>=0;i--){const tm=S.timers[i];tm.t-=dt;if(tm.t<=0){S.timers.splice(i,1);tm.fn();if(!S.running)return}}
  if(S.event){
    const E=S.event;
    E.ctl.tick?.(dt);
    if(S.event===E){
      E.left-=dt;
      const bar=$('#evBar'); if(bar) bar.style.width=Math.max(0,E.left/E.dur*100)+'%';
      if(E.left<=0) E.api.fail(E.D.timeout);
    }
  }else if(S.task){
    S.task.tick?.(dt);
    if(S.task){S.nextEvent-=dt;if(S.nextEvent<=0)startEvent()}
    SND.setTempo(musicTempo(false));
  }
  if(S.running) renderHUD(false);
}
requestAnimationFrame(frame);

// La fuente arcade no trae letras acentuadas: se las quitamos al texto que la usa
const PIX=/Press Start/;
function deaccent(root){
  const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);let n;
  while((n=w.nextNode())){
    const v=n.nodeValue; if(!/[^\x00-\x7F]/.test(v)) continue;
    const p=n.parentElement; if(!p||!PIX.test(getComputedStyle(p).fontFamily)) continue;
    const c=v.normalize('NFD').replace(/[\u0300-\u036f]/g,'');
    if(c!==v) n.nodeValue=c;
  }
}
new MutationObserver(ms=>{for(const m of ms){const t=m.type==='characterData'?m.target.parentNode:m.target;if(t)deaccent(t)}})
  .observe(document.body,{childList:true,subtree:true,characterData:true});
showTitle();
deaccent(document.body);
})();
</script>
